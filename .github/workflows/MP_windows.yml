name: MP_Windows

on:
  push:
    paths:
      - '.github/**'
      - 'mp/src/**'
  pull_request:
   paths:
      - 'mp/src/**'

jobs:
  build:
    runs-on:
      windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure dependencies
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create project
        working-directory: mp/src
        run: devtools/bin/vpc.exe /custom +gamedlls /mksln tehcooler.sln

      - name: Build project
        working-directory: mp/src
        run: devenv tehcooler.sln /Build Release

      - name: Pack
        shell: bash
        run: tar cJfv Windows.tar.xz mp/game/mod_custom/bin

      - name: Upload product
        uses: actions/upload-artifact@v4
        with:
          name: tehcooler_dlls
          path: Windows.tar.xz
          if-no-files-found: error
